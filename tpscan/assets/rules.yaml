# Exposure rating rules. The question each rating answers: if this vendor were
# compromised tomorrow, what could it do to this page's visitors?
#
# Rules are checked in order. The first match sets the item's rating; every
# matching rule adds its reasons, so the report shows all of them.
# A rule marked `fallback: true` only applies when no other rule matched.
# Items no rule matches (first-party and owned resources) are rated "none".
#
# `when` keys (all must hold):
#   kind                       script | iframe | worker | service-worker | websocket |
#                              fetch | beacon | image | stylesheet | font | other (or a list)
#   party                      first | owned | third (or a list)
#   frame                      top | sub | worker | service-worker (or a list)
#   category                   vendor category (or a list), e.g. tag-manager
#   sri                        true | false   (false also matches "unknown": the script left the DOM)
#   sensitivePage              true | false   (password, payment or login/checkout form on the page)
#   loadedByThirdPartyScript   true | false
#   weakIsolation              true | false   (iframe: no sandbox, allow-scripts + allow-same-origin,
#                                              or powerful `allow` permissions)

rules:
  - id: sensitive-page-unpinned-script
    rating: critical
    when: { kind: script, party: third, frame: top, sri: false, sensitivePage: true }
    reasons:
      - third-party script in top frame
      - no SRI
      - sensitive page (password, payment or login field)

  - id: unpinned-top-frame-script
    rating: high
    when: { kind: script, party: third, frame: top, sri: false }
    reasons:
      - third-party script in top frame
      - no SRI

  - id: tag-manager
    rating: high
    when: { party: third, category: tag-manager }
    reasons:
      - tag manager can load further code nobody at the site reviewed

  - id: loaded-by-third-party-script
    rating: high
    when: { kind: script, party: third, loadedByThirdPartyScript: true }
    reasons:
      - loaded by another third-party script

  - id: service-worker-import
    rating: high
    when: { kind: script, party: third, frame: service-worker }
    reasons:
      - imported into a service worker, which can intercept the site's own requests

  - id: third-party-service-worker
    rating: high
    when: { kind: service-worker, party: third }
    reasons:
      - third-party service worker

  - id: pinned-top-frame-script
    rating: medium
    when: { kind: script, party: third, frame: top, sri: true }
    reasons:
      - third-party script in top frame
      - pinned with SRI; the vendor still has page access if the hash is updated

  - id: weak-iframe
    rating: medium
    when: { kind: iframe, party: third, weakIsolation: true }
    reasons:
      - iframe isolation weakened (no sandbox, allow-scripts with allow-same-origin, or powerful permissions)

  - id: outbound-data
    rating: medium
    when: { kind: [fetch, beacon, websocket], party: third }
    reasons:
      - data sent to a third party

  - id: third-party-worker
    rating: medium
    when: { kind: worker, party: third }
    reasons:
      - third-party web worker

  - id: low-exposure
    rating: low
    fallback: true
    when: { party: third }
    reasons:
      - third-party resource with little ability to run code in the page
